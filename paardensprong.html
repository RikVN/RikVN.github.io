<script>
'use strict';
(() => {
  const WORDS = JSON.parse(document.getElementById('word-data').textContent);
  const WORD_SET = new Set(WORDS);
  const CYCLE = [0, 5, 6, 1, 8, 3, 2, 7];
  const DURATION = 60000;
  const $ = id => document.getElementById(id);
  const board = $('board'), input = $('answer'), form = $('answer-form'), feedback = $('feedback');
  const timer = $('timer'), time = $('time'), start = $('start'), next = $('next'), check = $('check');
  const cells = new Map();
  let phase = 'ready', bag = [], lastWord = '', lastStart = -1, round = 0;
  let activeWord = '', layout = [], validAnswers = new Map(), interval = null;
  let startWall = 0, startMono = 0, secondsShown = 60, warned = false;
  const tokenize = word => word.match(/ij|[a-z]/g) || [];
  const normalise = value => value.trim().toLowerCase().replace(/ĳ/g, 'ij');
  function randomInt(max) {
    if (globalThis.crypto && typeof globalThis.crypto.getRandomValues === 'function') {
      const values = new Uint32Array(1), limit = 4294967296 - (4294967296 % max);
      do { globalThis.crypto.getRandomValues(values); } while (values[0] >= limit);
      return values[0] % max;
    }
    return Math.floor(Math.random() * max);
  }
  function shuffle(values) {
    for (let i = values.length - 1; i > 0; i--) {
      const j = randomInt(i + 1); [values[i], values[j]] = [values[j], values[i]];
    }
    return values;
  }
  function takeWord() {
    if (!bag.length) {
      bag = shuffle([...WORDS]);
      if (bag[bag.length - 1] === lastWord) [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]];
    }
    lastWord = bag.pop();
    return lastWord;
  }
  function pathFor(offset, direction) {
    return Array.from({length: 8}, (_, i) => CYCLE[(offset + direction * i + 16) % 8]);
  }
  function answersFor(letters) {
    const answers = new Map();
    for (let offset = 0; offset < 8; offset++) {
      for (const direction of [-1, 1]) {
        const path = pathFor(offset, direction);
        const word = path.map(index => letters[index]).join('').toLowerCase();
        if (WORD_SET.has(word)) answers.set(word, path);
      }
    }
    return answers;
  }
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    if (i === 4) {
      cell.className = 'center'; cell.setAttribute('aria-hidden', 'true');
      cell.innerHTML = '<svg><use href="#horse"/></svg>';
    } else {
      cell.className = 'tile';
      cell.innerHTML = '<span class="number" aria-hidden="true"></span><span class="letter">·</span>';
      cell.setAttribute('aria-label', `Rij ${Math.floor(i / 3) + 1}, kolom ${i % 3 + 1}: leeg`);
      cells.set(i, cell);
    }
    board.appendChild(cell);
  }
  function setFeedback(message, kind = '') {
    feedback.textContent = message;
    feedback.className = 'status' + (kind ? ' ' + kind : '');
  }
  function elapsed() { return Math.max(0, Date.now() - startWall, performance.now() - startMono); }
  function paintTimer(remaining) {
    const seconds = Math.ceil(remaining / 1000);
    time.textContent = `${Math.floor(seconds / 60).toString().padStart(2, '0')}:${(seconds % 60).toString().padStart(2, '0')}`;
    timer.style.setProperty('--remaining', Math.max(0, remaining / DURATION));
    timer.classList.toggle('urgent', remaining <= 10000);
    if (seconds !== secondsShown) {
      timer.setAttribute('aria-label', `${seconds} seconden resterend`);
      secondsShown = seconds;
    }
  }
  function reveal(word) {
    const path = validAnswers.get(word);
    path.forEach((index, order) => {
      const cell = cells.get(index);
      cell.classList.add('reveal');
      cell.classList.toggle('first', order === 0);
      cell.querySelector('.number').textContent = order + 1;
      cell.setAttribute('aria-label', `Stap ${order + 1}: ${layout[index].toUpperCase()}, rij ${Math.floor(index / 3) + 1}, kolom ${index % 3 + 1}`);
    });
  }
  function finish(result, word = activeWord) {
    if (phase !== 'playing') return;
    phase = result;
    clearInterval(interval); interval = null;
    check.disabled = true; input.disabled = true; input.removeAttribute('aria-invalid');
    $('secondary').hidden = true; next.hidden = false;
    reveal(word);
    if (result === 'won') {
      paintTimer(Math.max(0, DURATION - elapsed()));
      setFeedback(`Goed! ${word.toUpperCase()} · ${Math.min(60, Math.max(1, Math.ceil(elapsed() / 1000)))} seconden`, 'success');
    } else {
      if (result === 'expired') paintTimer(0);
      setFeedback(`${result === 'expired' ? 'Tijd om.' : 'Het antwoord:'} ${word.toUpperCase()}`, 'ended');
    }
    next.focus({preventScroll: true});
  }
  function tick() {
    if (phase !== 'playing') return;
    const remaining = Math.max(0, DURATION - elapsed());
    paintTimer(remaining);
    if (!remaining) { finish('expired'); return; }
    if (remaining <= 10000 && !warned) {
      warned = true; $('announcement').textContent = 'Nog 10 seconden.';
    }
  }
  function newRound() {
    clearInterval(interval);
    activeWord = takeWord();
    const offsets = Array.from({length: 8}, (_, i) => i).filter(i => i !== lastStart);
    lastStart = offsets[randomInt(offsets.length)];
    const path = pathFor(lastStart, randomInt(2) ? 1 : -1);
    const letters = tokenize(activeWord);
    layout = Array(9).fill('');
    path.forEach((index, order) => { layout[index] = letters[order]; });
    validAnswers = answersFor(layout);
    cells.forEach((cell, index) => {
      cell.className = 'tile' + (layout[index] === 'ij' ? ' ij' : '');
      cell.querySelector('.letter').textContent = layout[index].toUpperCase();
      cell.querySelector('.number').textContent = '';
      cell.setAttribute('aria-label', `Rij ${Math.floor(index / 3) + 1}, kolom ${index % 3 + 1}: ${layout[index].toUpperCase()}`);
    });
    board.classList.remove('ready');
    round++; $('round-label').textContent = `Puzzel ${String(round).padStart(2, '0')}`;
    start.hidden = true; next.hidden = true; form.hidden = false; $('secondary').hidden = false;
    input.disabled = false; check.disabled = false; input.value = ''; input.removeAttribute('aria-invalid');
    setFeedback(''); $('announcement').textContent = '';
    phase = 'playing'; warned = false; startWall = Date.now(); startMono = performance.now();
    secondsShown = -1; paintTimer(DURATION);
    interval = setInterval(tick, 100);
    input.focus({preventScroll: true});
  }
  form.addEventListener('submit', event => {
    event.preventDefault();
    if (phase !== 'playing') return;
    tick(); if (phase !== 'playing') return;
    const guess = normalise(input.value);
    if (!guess) { setFeedback('Typ eerst een woord.', 'error'); input.focus(); return; }
    if (validAnswers.has(guess)) { finish('won', guess); return; }
    input.setAttribute('aria-invalid', 'true');
    setFeedback('Nog niet. Probeer opnieuw.', 'error');
    input.focus({preventScroll: true}); input.select();
  });
  input.addEventListener('input', () => {
    if (phase !== 'playing') return;
    input.removeAttribute('aria-invalid');
    if (feedback.classList.contains('error')) setFeedback('');
  });
  start.addEventListener('click', newRound);
  next.addEventListener('click', newRound);
  $('skip').addEventListener('click', () => { tick(); if (phase === 'playing') finish('skipped'); });
  document.addEventListener('visibilitychange', tick);
  window.addEventListener('pageshow', tick);
  window.addEventListener('focus', tick);
})();
</script>
