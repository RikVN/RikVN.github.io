<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nobel sentence challenge</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fafafa;color:#202c29;font:17px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:6vh auto;padding:24px}
h1{font-size:clamp(25px,5vw,34px);line-height:1.2;margin:0 0 18px}
p{margin:12px 0 20px}
label{display:block;font-weight:600;margin:24px 0 8px}
textarea{display:block;width:100%;min-height:140px;resize:vertical;padding:14px;border:1px solid #88978e;border-radius:6px;background:white;font:inherit;color:inherit}
textarea:focus,button:focus-visible{outline:3px solid #3d8760;outline-offset:3px}
button{margin:16px 0 24px;background:#204f3c;color:white;border:0;border-radius:6px;padding:12px 24px;font:600 16px system-ui;cursor:pointer}
button:hover{background:#163b2c}
.result{padding:20px;background:white;border:1px solid #cbd4cd;border-left:4px solid #204f3c;border-radius:6px;overflow-wrap:anywhere}
.result h2{margin:0;font-size:24px}
.method{display:inline-block;margin:0 0 12px;padding:5px 10px;border:1px solid currentColor;border-radius:4px;font-weight:700;color:#204f3c;background:#edf6ef}
.method.fallback{color:#754300;background:#fff1d6}
.method.none{color:#526158;background:#f1f3f2}
.status{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;margin:16px 0 0;padding:12px 16px;border:1px solid #91c7a1;border-radius:8px;background:#eaf7ee;color:#176036}
.status::before{content:"✓";font-size:24px;line-height:1}
.wrong{border-left-color:#b42332}
.wrong .status{border-color:#e6a0a7;background:#fff0f1;color:#a51d2d}
.wrong .status::before{content:"×"}
#explanation{margin:12px 0 0}
#error{color:#9b351f}
footer{margin-top:24px;font-size:14px;color:#526158}
</style>
</head>
<body>
<main>
<h1>Who won the Nobel Prize in Physics in 1953?</h1>
<p>Fool the system with the shortest clear English sentence stating who won. Include both “Frits” and “Zernike”, with exactly this capitalisation, somewhere in your sentence; distractors are allowed.</p>
<form id="form">
<label for="sentence">Your sentence</label>
<textarea id="sentence" maxlength="3000" required spellcheck="false">Frits Zernike won the Nobel Prize in Physics in 1953.</textarea>
<button type="submit">Check sentence</button>
</form>
<p id="error" role="alert" hidden></p>
<section id="result" class="result" aria-live="polite" aria-label="System answer" hidden>
<p id="method" class="method"></p>
<h2 id="answer"></h2>
<p id="status" class="status"></p>
<p id="explanation"></p>
</section>
<footer id="version"></footer>
</main>

/* Grading only: engine.js never imports or reads this file. */
(function(root) {
  const normalize = s => (s || '').normalize('NFKC').toLowerCase().replace(/[.]/g,'').replace(/\s+/g,' ').trim();
  const aliases = ['frits zernike','frederik zernike','frits frederik zernike','f zernike','zernike'];
  const check = answer => aliases.includes(normalize(answer));
  if (typeof module !== 'undefined' && module.exports) module.exports = {check};
  else root.NobelChecker = {check};

</script><script>
'use strict';
const $ = id => document.getElementById(id);

// Explain the evidence actually used, independently of the answer checker.
function explainResult(result) {
  if (result.fallback) return `Fallback guess: ${result.fallbackReason}.`;
  const candidate = result.answer
    ? result.candidates.find(item => item.name === result.answer)
    : result.candidates.find(item => item.evidence.length);
  const hit = candidate?.evidence[0];
  if (!hit) return 'No name was recognised. Use a capitalised name.';
  let explanation = `Rule: ${hit.reasons[0]}.`;
  if (!result.answer) {
    const reasons = hit.reasons.slice(1).filter(reason => !reason.startsWith('Target '));
    explanation += ` Match rejected${reasons.length ? ': ' + reasons.join('; ') : ' because its score was too low'}.`;
  } else if (result.candidates.some(item => item.name !== candidate.name && item.score === candidate.score)) {
    explanation += ' Tied scores: the first-mentioned name was chosen.';
  }
  return explanation;
}
$('version').textContent = `Rules v${NobelRules.VERSION}`;
$('form').addEventListener('submit', event => {
  event.preventDefault();
  $('error').hidden = true;
  try {
    const sentence = $('sentence').value.trim();
    if (!sentence) throw new Error('Please enter a sentence.');
    if (!/(?<![\p{L}\p{M}\p{N}_])Frits(?![\p{L}\p{M}\p{N}_])/u.test(sentence) ||
        !/(?<![\p{L}\p{M}\p{N}_])Zernike(?![\p{L}\p{M}\p{N}_])/u.test(sentence)) {
      throw new Error('Your sentence must contain both “Frits” and “Zernike”, with exactly this capitalisation.');
    }
    const result = NobelRules.extract(sentence);
    const correct = NobelChecker.check(result.answer);
    $('method').textContent = !result.answer ? 'No extraction or guess' : result.fallback ? 'Fallback guess' : 'Rule-based extraction';
    $('method').className = 'method' + (!result.answer ? ' none' : result.fallback ? ' fallback' : '');
    $('answer').textContent = result.answer || 'No answer found';
    $('status').textContent = correct ? 'Correct' : 'Incorrect';
    $('explanation').textContent = explainResult(result);
    $('result').className = 'result' + (correct ? '' : ' wrong');
    $('result').hidden = false;
  } catch(error) {
    $('error').textContent = error.message;
    $('error').hidden = false;
    $('result').hidden = true;
  }
});
$('sentence').addEventListener('input', () => {
  $('result').hidden = true;
  $('error').hidden = true;
});
$('sentence').addEventListener('keydown', event => {
  if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
    event.preventDefault();
    $('form').requestSubmit();
  }
});

</script>
